# PROD on EKS: two Prometheus replicas, longer retention, HA Alertmanager.
prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi

alertmanager:
  alertmanagerSpec:
    replicas: 2
    secrets: [alertmanager-slack]
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, namespace, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: slack
          matchers: ['severity = "critical"']
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#cloudcart-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ "\n" }}{{ end }}'
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [alertname, namespace, job]

grafana:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
