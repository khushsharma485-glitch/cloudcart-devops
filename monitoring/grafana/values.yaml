# Grafana (subchart of kube-prometheus-stack).
grafana:
  # Admin credentials come from a Secret, never from values:
  #   EKS:   ExternalSecret from Secrets Manager (argocd/platform/secret-stores)
  #   local: created with a random password by scripts/local-cluster
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  defaultDashboardsTimezone: utc

  # Dashboards are ConfigMaps labelled grafana_dashboard=1 (monitoring/grafana/dashboards).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        maxLines: 1000

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
