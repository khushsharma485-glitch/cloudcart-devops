# Grafana dashboards as code. The Grafana sidecar loads every ConfigMap
# labelled grafana_dashboard=1. Regenerate the JSON with generate_dashboard.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: CloudCart
configMapGenerator:
  - name: cloudcart-dashboards
    files:
      - dashboards/cloudcart-overview.json
