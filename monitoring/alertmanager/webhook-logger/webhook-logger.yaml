# Local stand-in for Slack/PagerDuty: an HTTP echo server that logs every
# notification Alertmanager sends, so the full alert path can be verified:
#   kubectl -n monitoring logs deploy/alert-webhook-logger
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook-logger
  labels:
    app.kubernetes.io/name: alert-webhook-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-webhook-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-webhook-logger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: mendhak/http-https-echo:42
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 5m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-logger
spec:
  selector:
    app.kubernetes.io/name: alert-webhook-logger
  ports:
    - name: http
      port: 8080
      targetPort: http
