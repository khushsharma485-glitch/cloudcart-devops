# Local kind cluster (scripts/local-cluster). In-cluster Postgres, Traefik
# ingress, local images, chaos endpoints on.

global:
  environment: local
  image:
    registry: ""
    tag: local

config:
  dbHost: postgres
  dbSslMode: disable
  chaosEnabled: true

database:
  # Created by scripts/local-cluster/local-cluster.sh with a random password.
  secretName: cloudcart-db

reloader:
  enabled: false

serviceDefaults:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    minReplicas: 1
    # Capped at 2 locally: an HPA at 4 plus a blue-green preview at 4 meant
    # 8 JVMs on one 8 GB Docker VM, which exhausted node memory and took a
    # kind node NotReady (docs/incidents/07-node-failure.md).
    maxReplicas: 2
  pdb:
    minAvailable: 0

services:
  order-service:
    strategy: blueGreen
    image:
      tag: "2.5.0"

ingress:
  className: traefik
  annotations: {}

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  databaseTo:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres

postgres:
  enabled: true
  replicas: 0 # GAME DAY: database outage drill - revert this commit to end it

blueGreen:
  # Short deadline so failed-deployment drills finish quickly.
  progressDeadlineSeconds: 180
  # Keep blue around for 5 minutes after a switch (instant rollback window).
  scaleDownDelaySeconds: 300
