{{- $bg := false }}
{{- range $name, $_ := .Values.services }}
{{- $svc := include "cloudcart.svc" (dict "root" $ "name" $name) | fromYaml }}
{{- if and $svc.enabled (eq $svc.strategy "blueGreen") }}{{ $bg = true }}{{ end }}
{{- end }}
{{- if $bg }}
# Pre-promotion gate: run against the GREEN (preview) Service before it gets
# live traffic. Any failure aborts the Rollout and BLUE keeps serving.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloudcart-smoke
  labels:
    {{- include "cloudcart.labels" (dict "root" .) | nindent 4 }}
spec:
  args:
    - name: service-url
    - name: api-path
  metrics:
    - name: smoke-test
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 180
            template:
              metadata:
                labels:
                  cloudcart.io/role: smoke-test
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke
                    image: {{ .Values.smokeTest.image }}
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        url="{{ "{{args.service-url}}" }}"
                        echo "readiness: $url/actuator/health/readiness"
                        for i in $(seq 1 12); do
                          curl -fsS -m 5 "$url/actuator/health/readiness" && break
                          [ "$i" = 12 ] && { echo "green never became ready"; exit 1; }
                          sleep 5
                        done
                        echo; echo "api: $url{{ "{{args.api-path}}" }}"
                        code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "$url{{ "{{args.api-path}}" }}")
                        echo "HTTP $code"
                        [ "$code" = 200 ]
                    resources:
                      requests: { cpu: 10m, memory: 16Mi }
                      limits: { cpu: 100m, memory: 64Mi }
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
{{- if .Values.monitoring.serviceMonitor.enabled }}
---
# Post-promotion gate: after GREEN takes live traffic, watch its 5xx ratio
# for 5 minutes. A breach aborts the Rollout and traffic returns to BLUE,
# which is still running (scaleDownDelaySeconds), so rollback is instant.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloudcart-error-rate
  labels:
    {{- include "cloudcart.labels" (dict "root" .) | nindent 4 }}
spec:
  args:
    - name: service
  metrics:
    - name: error-rate
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: "result[0] <= {{ .Values.blueGreen.analysis.maxErrorRate }}"
      provider:
        prometheus:
          address: {{ .Values.blueGreen.analysis.prometheusAddress }}
          query: |
            (sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}", job="{{ "{{args.service}}" }}", uri!~"/actuator.*", status=~"5.."}[2m])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}", job="{{ "{{args.service}}" }}", uri!~"/actuator.*"}[2m])) or vector(0)), 0.000001)
{{- end }}
{{- end }}
