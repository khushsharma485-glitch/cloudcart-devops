{{- /*
The chart never renders a password. Either:
  - External Secrets creates the Secret from AWS Secrets Manager (EKS), or
  - the Secret already exists (created out-of-band, e.g. local cluster script).
*/ -}}
{{- if .Values.database.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "cloudcart.labels" (dict "root" .) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.database.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.database.externalSecret.secretStore }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.externalSecret.remoteKey is required" .Values.database.externalSecret.remoteKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.externalSecret.remoteKey | quote }}
        property: password
{{- end }}
