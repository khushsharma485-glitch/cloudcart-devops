# DEV on EKS - small and cheap. Rolling updates for everything; order-service
# uses blue-green so the strategy is exercised before it reaches prod.

global:
  environment: dev
  image:
    registry: "123456789012.dkr.ecr.eu-west-1.amazonaws.com" # terraform output ecr_repository_urls
    # Updated by CI (gitops-bump job) after every successful main build.
    tag: "replace-with-first-ci-build-sha"

config:
  dbHost: "cloudcart-dev.xxxxxxxxxxxx.eu-west-1.rds.amazonaws.com" # terraform output rds_address
  logLevel: DEBUG
  chaosEnabled: true # incident drills run in dev

database:
  externalSecret:
    enabled: true
    remoteKey: "rds!db-replace-with-terraform-output" # terraform output rds_master_secret_arn

serviceDefaults:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  pdb:
    minAvailable: 0

services:
  order-service:
    strategy: blueGreen
