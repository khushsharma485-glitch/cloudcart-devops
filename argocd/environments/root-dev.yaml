# Root "app of apps" for dev. Apply it once after installing Argo CD:
#   kubectl apply -f argocd/environments/root-dev.yaml
# From then on, everything is driven by Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/your-github-user/cloudcart-devops.git
    targetRevision: main
    path: argocd/apps
    helm:
      valueFiles:
        - values-dev.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
