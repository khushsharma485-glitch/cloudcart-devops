{{- $env := .Values.environment }}
{{- $a := .Values.addons }}
{{- /* Sync waves: CRD-providing add-ons first (-2), then the rest (-1), then apps (0). */ -}}

{{- if $a.argoRollouts.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  source:
    repoURL: {{ $a.argoRollouts.repo }}
    chart: {{ $a.argoRollouts.chart }}
    targetRevision: {{ $a.argoRollouts.version }}
    helm:
      valuesObject:
        dashboard:
          enabled: true
        controller:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  {{- include "apps.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if $a.monitoring.enabled }}
---
# Prometheus + Alertmanager + Grafana + kube-state-metrics + node-exporter.
# Values are layered: shared files per component, then the environment file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: {{ $a.monitoring.repo }}
      chart: {{ $a.monitoring.chart }}
      targetRevision: {{ $a.monitoring.version }}
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/prometheus/values.yaml
          - $values/monitoring/alertmanager/values.yaml
          - $values/monitoring/grafana/values.yaml
          - $values/monitoring/values-{{ $env }}.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
# Grafana dashboards (ConfigMaps picked up by the Grafana sidecar) and the
# local alert receiver.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: monitoring/overlays/{{ $env }}
  {{- include "apps.syncPolicy" . | nindent 2 }}
{{- end }}

