{{- if $a.externalSecrets.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  source:
    repoURL: {{ $a.externalSecrets.repo }}
    chart: {{ $a.externalSecrets.chart }}
    targetRevision: {{ $a.externalSecrets.version }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets # bound to an IAM role by EKS Pod Identity (terraform/modules/iam)
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: argocd/platform/secret-stores
    helm:
      valuesObject:
        region: {{ required "addons.awsLoadBalancerController.region" $a.awsLoadBalancerController.region }}
        environment: {{ $env }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # The External Secrets CRDs come from the external-secrets Application.
      - SkipDryRunOnMissingResource=true
{{- end }}

{{- if $a.awsLoadBalancerController.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: {{ $a.awsLoadBalancerController.repo }}
    chart: {{ $a.awsLoadBalancerController.chart }}
    targetRevision: {{ $a.awsLoadBalancerController.version }}
    helm:
      valuesObject:
        clusterName: {{ required "addons.awsLoadBalancerController.clusterName" $a.awsLoadBalancerController.clusterName }}
        region: {{ $a.awsLoadBalancerController.region }}
        vpcId: {{ $a.awsLoadBalancerController.vpcId }}
        replicaCount: 2
        serviceAccount:
          name: aws-load-balancer-controller # EKS Pod Identity (terraform/modules/iam)
  {{- include "apps.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if $a.reloader.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  {{- include "apps.meta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  source:
    repoURL: {{ $a.reloader.repo }}
    chart: {{ $a.reloader.chart }}
    targetRevision: {{ $a.reloader.version }}
    helm:
      valuesObject:
        reloader:
          isArgoRollouts: true
          watchGlobally: true
  {{- include "apps.syncPolicy" . | nindent 2 }}
{{- end }}
