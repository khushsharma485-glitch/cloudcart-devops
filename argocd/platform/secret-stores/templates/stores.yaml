# Authenticates with the external-secrets service account's EKS Pod
# Identity role, which may read only the RDS secret and cloudcart/<env>/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
# Grafana admin login. Create it once:
#   aws secretsmanager create-secret --name cloudcart/{{ .Values.environment }}/grafana-admin \
#     --secret-string '{"admin-user":"admin","admin-password":"<generated>"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: cloudcart/{{ .Values.environment }}/grafana-admin
---
# Slack incoming-webhook URL used by Alertmanager:
#   aws secretsmanager create-secret --name cloudcart/{{ .Values.environment }}/alertmanager-slack \
#     --secret-string '{"webhook-url":"https://hooks.slack.com/services/..."}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-slack
  dataFrom:
    - extract:
        key: cloudcart/{{ .Values.environment }}/alertmanager-slack
