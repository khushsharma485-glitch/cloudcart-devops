# EXAMPLE ONLY - shows the shape of the Secret the services expect.
#
# Never commit a filled-in copy (.gitignore blocks secrets*.yaml). On EKS the
# Secret is created by External Secrets (external-secret.yaml). For a local
# cluster, create it imperatively so the value never touches a file:
#
#   kubectl -n cloudcart create secret generic cloudcart-db \
#     --from-literal=username=cloudcart \
#     --from-literal=password="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: cloudcart-db
type: Opaque
stringData:
  username: "<set-at-deploy-time>"
  password: "<set-at-deploy-time>"
