# Database credentials are never stored in Git.
#
# The RDS master password is generated by AWS and kept in Secrets Manager
# (terraform: manage_master_user_password = true). External Secrets
# Operator reads it with its own Pod Identity role (read-only, that one
# secret) and writes the Kubernetes Secret "cloudcart-db". It re-syncs
# hourly, so a rotated password reaches the cluster automatically, and
# Reloader then restarts the pods to pick it up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudcart-db
  labels:
    app.kubernetes.io/part-of: cloudcart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cloudcart-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        # terraform output rds_master_secret_arn
        key: "rds!db-REPLACE-WITH-TERRAFORM-OUTPUT"
        property: username
    - secretKey: password
      remoteRef:
        key: "rds!db-REPLACE-WITH-TERRAFORM-OUTPUT"
        property: password
