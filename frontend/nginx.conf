# Serves the static storefront and proxies /api/* to the services
# (the same path routing the Kubernetes Ingress does).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/users    { proxy_pass http://user-service:8080; }
    location /api/products { proxy_pass http://product-service:8080; }
    location /api/orders   { proxy_pass http://order-service:8080; }

    location / { try_files $uri /index.html; }
}
