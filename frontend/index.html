<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudCart</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1f2933; --muted:#616e7c; --accent:#2b8a3e; --line:#e4e7eb; --err:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; } header p { margin:2px 0 0; color:var(--muted); }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; padding:16px 24px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { margin:0 0 10px; font-size:17px; }
  form { display:grid; gap:8px; margin-bottom:12px; }
  input, select, button { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; max-height:280px; overflow:auto; }
  li { padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .muted { color:var(--muted); } .err { color:var(--err); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>CloudCart</h1>
  <p>Minimal storefront for the user, product and order services. It exists to exercise the APIs; the project's focus is the delivery platform.</p>
</header>
<main>
  <section>
    <h2>Users</h2>
    <form id="user-form">
      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <button>Create user</button>
    </form>
    <ul id="users"></ul>
  </section>
  <section>
    <h2>Products</h2>
    <form id="product-form">
      <input name="name" placeholder="Product name" required>
      <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
      <input name="stock" type="number" min="0" placeholder="Stock" required>
      <button>Add product</button>
    </form>
    <ul id="products"></ul>
  </section>
  <section>
    <h2>Orders</h2>
    <form id="order-form">
      <select name="userId" id="order-user" required></select>
      <select name="productId" id="order-product" required></select>
      <input name="quantity" type="number" min="1" value="1" required>
      <button>Place order</button>
    </form>
    <div id="order-msg" class="muted"></div>
    <ul id="orders"></ul>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && (body.detail || body.title)) || `HTTP ${res.status}`);
    return body;
  }

  async function refresh() {
    const [users, products] = await Promise.all([api("/api/users"), api("/api/products")]);
    $("users").innerHTML = users.map((u) => `<li>#${u.id} ${esc(u.name)} <span class="muted">${esc(u.email)}</span></li>`).join("") || '<li class="muted">No users yet</li>';
    $("products").innerHTML = products.map((p) => `<li>#${p.id} ${esc(p.name)} <span class="muted">${p.price} &middot; stock ${p.stock}</span></li>`).join("") || '<li class="muted">No products yet</li>';
    $("order-user").innerHTML = users.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
    $("order-product").innerHTML = products.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    const uid = $("order-user").value;
    const orders = uid ? await api(`/api/orders/user/${uid}`) : [];
    $("orders").innerHTML = orders.map((o) => `<li>#${o.id} qty ${o.quantity} = ${o.totalPrice} <span class="muted">${o.status}</span></li>`).join("") || '<li class="muted">No orders for this user</li>';
  }

  function form(id, handler) {
    $(id).addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try { await handler(data); e.target.reset(); $("order-msg").textContent = ""; }
      catch (err) { $("order-msg").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
      await refresh();
    });
  }

  form("user-form", (d) => api("/api/users", { method: "POST", body: JSON.stringify(d) }));
  form("product-form", (d) => api("/api/products", { method: "POST", body: JSON.stringify({ ...d, price: Number(d.price), stock: Number(d.stock) }) }));
  form("order-form", (d) => api("/api/orders", { method: "POST", body: JSON.stringify({ userId: Number(d.userId), productId: Number(d.productId), quantity: Number(d.quantity) }) }));
  $("order-user").addEventListener("change", refresh);
  refresh().catch((err) => { $("order-msg").innerHTML = `<span class="err">${esc(err.message)}</span>`; });
</script>
</body>
</html>
